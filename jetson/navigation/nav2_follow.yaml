controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom_lidar
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
      movement_time_allowance: 5.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.25
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.25
      regulated_linear_scaling_min_speed: 0.04
      inflation_cost_scaling_factor: 4.0
      cost_scaling_dist: 0.30
      transform_tolerance: 0.4
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.40
      max_angular_accel: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 6.0
      publish_frequency: 2.0
      transform_tolerance: 0.4
      footprint: '[[0.14,0.16],[0.14,-0.16],[-0.14,-0.16],[-0.14,0.16]]'
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.16
          obstacle_max_range: 2.0
          raytrace_min_range: 0.16
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 4.0
